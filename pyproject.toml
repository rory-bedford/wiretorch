[project]
name = "wiretorch"
version = "0.1.0b1"
description = "Neural network models built from connectomes, in PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rory Bedford" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.7.0",
    "numpy>=2.0,<2.3",
    "scipy>=1.16.3",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "pydantic>=2.12.3",
    "toml>=0.10.2",
    "tqdm>=4.67.1",
    "zarr>=3.1.3",
    "dask>=2025.11.0",
    "cma>=4.0.0",
]
# Triton comes with torch's Linux builds; without it (CPU-only torch, macOS) the
# networks run their PyTorch implementation.

[project.urls]
Documentation = "https://wiretorch.readthedocs.io"
Source = "https://github.com/rory-bedford/wiretorch"
Changelog = "https://github.com/rory-bedford/wiretorch/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Single namespaced package under src/ — `wiretorch` and its subpackages.
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Logging training runs to Weights & Biases.
wandb = ["wandb>=0.22.3"]
# Which torch build uv installs when developing wiretorch itself (see
# [tool.uv.sources]); a project using wiretorch picks its own.
cpu = ["torch>=2.7.0"]
cu129 = ["torch>=2.7.0"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu129" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "wandb>=0.22.3",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]
# The documentation (docs/): Sphinx reads the source without importing it, and the
# tutorials are committed executed, so this group needs neither torch nor the package.
docs = [
    "sphinx>=8.2",
    "furo>=2025.9.25",
    "myst-nb>=1.3",
    "sphinx-autoapi>=3.6",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tests/.pytest_cache"
addopts = "--basetemp=tests/.pytest_tmp"
markers = ["gpu: needs a CUDA GPU (skipped without one)"]
filterwarnings = ["ignore::UserWarning:torch.*"]

# Coverage can't follow the Triton kernels (compiled, not run as Python); they are
# tested against the PyTorch implementation instead.
[tool.coverage.run]
source = ["wiretorch"]
omit = ["*/kernels.py"]

[tool.ruff.lint]
ignore = ["E741"]

# Non-Python files the package reads at runtime (the Matplotlib style sheet).
[tool.setuptools.package-data]
wiretorch = ["visualization/*.mplstyle"]
